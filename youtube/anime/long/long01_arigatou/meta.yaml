title: "「ありがとう」の本当の意味｜百年に一度の、めったにないこと【ことにゃんのありがた言葉】"
opening_title: false
source: "仏教のたとえ話「盲亀浮木」（『雑阿含経』など）／『法句経』"
cover_time: 186.0
description: |
  「ありがとう」って、どういう意味？
  三毛猫のことにゃんが、ことば帖をひらいて、むかしのお話の海へ。

  「ありがとう」は、もともと「有り難し」――有ることが難しい、めったにない、という意味。
  海の底の目の見えない亀と、海をただよう丸太のたとえ話（盲亀浮木）とともに、
  いま ここに いることの「めったになさ」を、5分の小さなアニメでお届けします。
