title: "とどかない切り株の話 ｜ 雨垂れ石を穿つ #shorts"
source: "『漢書』枚乗伝"
cover_time: 25.8
description: |
  小さな一歩も、つづければ大きな力になる。

  「雨垂れ石を穿つ」は、中国の歴史書『漢書』枚乗伝の
  「泰山の霤（あまだれ）は石を穿つ」ということばがもとになった故事成語。
  小さなしずくでも、同じところに落ち続ければ石に穴をあける――
  小さな努力も根気よく続ければ、やがて成果が出るという意味です。
hashtags: ["#雨垂れ石を穿つ", "#故事成語", "#ことわざ", "#名言", "#ショートアニメ", "#ことにゃん", "#ありがた言葉", "#shorts"]
