title: "「挨拶」って、もとはお坊さんのことばだった…🐾 #挨拶 #禅 #ショートアニメ"
source: "禅のことば「一挨一拶（いちあいいっさつ）」"
cover_time: 21.4
description: |
  ことばを交わすと、心がすこし見えてくる。

  毎日つかう「挨拶（あいさつ）」は、もとは禅のことば「一挨一拶（いちあいいっさつ）」から。
  「挨」も「拶」も、押す・せまるという意味で、
  禅のお坊さんどうしが問答をして、相手の心（悟りの深さ）をたしかめ合うことを言いました。
  それがやがて、人と会ったときに交わすことばやしぐさの意味に広がっていきました。
hashtags: ["#挨拶", "#禅", "#仏教", "#語源", "#ショートアニメ", "#猫", "#ことにゃん", "#ありがた言葉", "#shorts"]
music: wafuu          # 曲集（anime/tunes.py）から：sanpo / wakuwaku / yuugure / wafuu / waltz
