title: "灯りがつかないちょうちんの話 ｜ 一隅を照らす #shorts"
source: "最澄『山家学生式』"
cover_time: 22.6
description: |
  遠くまで届く光じゃなくていい。
  自分のいる場所で、目の前の誰かのために、まごころを尽くす人こそが国の宝。

  「一隅を照らす、これ則ち国宝なり」は、天台宗をひらいた最澄のことば。
  原文は「照千一隅」で、「千里を照らし、一隅を守る」と読む説もあります。
