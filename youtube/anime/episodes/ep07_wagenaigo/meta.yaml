title: "ごきげんななめな朝の話 ｜ 和顔愛語 #shorts"
source: "『仏説無量寿経』"
cover_time: 21.4
description: |
  やわらかな笑顔と、やさしいことば。それだけで、まわりが明るくなる。

  「和顔愛語（わげんあいご）」は、浄土三部経のひとつ『仏説無量寿経』に出てくることば。
  おだやかな笑顔と、思いやりのあることばで人に接すること。
  お金や物がなくてもできる、まわりを明るくするおこないとして大切にされてきました。
