title: "ぬれた子に傘をあげたら、ずぶぬれ。でも…🐾 #情けは人の為ならず #ことわざ #ショートアニメ"
source: "ことわざ"
cover_time: 21.0
description: |
  人への親切は、めぐりめぐって自分にかえってくる。

  「情けは人の為ならず」は、
  「人に情けをかけるのは、その人のためだけでなく、やがて自分のためにもなる」という意味のことわざ。
  「情けをかけると、その人のためにならない（甘やかしになる）」という意味だと思われがちですが、それは誤用です。
hashtags: ["#情けは人の為ならず", "#ことわざ", "#誤用", "#名言", "#ショートアニメ", "#ことにゃん", "#ありがた言葉", "#shorts"]
