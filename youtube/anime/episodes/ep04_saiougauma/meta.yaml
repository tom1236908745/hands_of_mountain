title: "飛ばされた ことば帖の話 ｜ 塞翁が馬 #shorts"
source: "『淮南子』人間訓"
cover_time: 12.3
description: |
  いいことも、わるいことも、まだお話のとちゅう。

  「塞翁が馬」は、中国・前漢の書『淮南子』人間訓にある故事。
  国境のとりでの近くに住む老人の馬をめぐって、幸運と不運が次々に入れかわるお話から、
  「人生の幸・不幸は予測できない」という意味で使われます。
  「人間万事塞翁が馬」という形でもよく知られています。
hashtags: ["#塞翁が馬", "#故事成語", "#ことわざ", "#ショートアニメ", "#猫", "#ことにゃん", "#ありがた言葉", "#shorts"]
