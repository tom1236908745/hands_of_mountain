title: "こわそうな黒ねこの話 ｜ 目から鱗 #shorts"
source: "新約聖書『使徒言行録』9章18節"
cover_time: 21.0
description: |
  思いこみがポロリと落ちると、ほんとうの姿が見えてくる。

  「目から鱗が落ちる」は、新約聖書『使徒言行録』9章18節から生まれたことば。
  目が見えなくなっていたサウロ（のちのパウロ）の目から、うろこのようなものが落ちて
  再び見えるようになった場面がもとになっています。
  いまは「何かをきっかけに、急に物事がよく分かるようになる」という意味で使われます。
hashtags: ["#目から鱗", "#聖書", "#ことわざ", "#名言", "#ショートアニメ", "#ことにゃん", "#ありがた言葉", "#shorts"]
music: yuugure          # 曲集（anime/tunes.py）から：sanpo / wakuwaku / yuugure / wafuu / waltz
